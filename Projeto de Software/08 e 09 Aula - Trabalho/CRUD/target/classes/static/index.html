<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold">Sistema de Cadastro</h1>
        <p class="text-muted">Gerencie seus produtos e categorias</p>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center p-4">
                    <h4 class="card-title mb-3">Produtos</h4>
                    <p class="text-muted mb-4">Cadastre e gerencie seus produtos</p>
                    <a href="/produto/listar" class="btn btn-primary w-100 mb-2">Abrir Produto</a>
                </div>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center p-4">
                    <h4 class="card-title mb-3">Categorias</h4>
                    <p class="text-muted mb-4">Organize seus produtos por categoria</p>
                    <a href="/categoria/listar" class="btn btn-success w-100 mb-2">Abrir Categoria</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
