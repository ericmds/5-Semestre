<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm mx-auto border-danger" style="max-width: 500px">
        <div class="card-body text-center p-4">
            <h2 class="text-danger mb-3">Ocorreu um erro</h2>
            <p class="text-muted" th:text="${message}">Mensagem de erro</p>
            <a href="/" class="btn btn-outline-secondary mt-2">Voltar ao Início</a>
        </div>
    </div>
</div>
</body>
</html>
