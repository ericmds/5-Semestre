<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Produtos</h2>
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-outline-secondary">Início</a>
            <a href="/produto/formulario" class="btn btn-primary">Novo Produto</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Quantidade</th>
                        <th>Categoria</th>
                        <th>Imagem</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="produto : ${produtos}">
                        <td th:text="${produto.id}"></td>
                        <td th:text="${produto.nome}"></td>
                        <td th:text="${produto.descricao}"></td>
                        <td th:text="${produto.valor}"></td>
                        <td th:text="${produto.quantidade}"></td>
                        <td th:text="${produto.categoria != null ? produto.categoria.nome : 'Sem categoria'}"></td>
                        <td><img th:src="${produto.imagem}" style="width: 50px"
                                 th:if="${produto.imagem != null and !produto.imagem.isEmpty()}"></td>
                        <td>
                            <a class="btn btn-warning btn-sm" th:href="@{/produto/editar/{id}(id=${produto.id})}">Editar</a>
                            <a class="btn btn-danger btn-sm" th:href="@{/produto/deletar/{id}(id=${produto.id})}">Excluir</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="8" class="text-center text-muted py-3">Nenhum produto cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
