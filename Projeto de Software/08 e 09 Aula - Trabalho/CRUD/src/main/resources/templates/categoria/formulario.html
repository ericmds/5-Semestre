<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Categoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width: 500px">
        <div class="card-body p-4">

            <div class="d-flex align-items-center gap-3 mb-4">
                <h2 class="card-title mb-0">Cadastro de Categoria</h2>
            </div>

            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

            <form method="POST" action="/categoria/salvar" th:object="${categoria}">
                <input type="hidden" th:field="*{id}">

                <div class="mb-4">
                    <label class="form-label">Nome:</label>
                    <input type="text" class="form-control" th:field="*{nome}">
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="/categoria/listar" class="btn btn-secondary">Voltar</a>
                    <div class="d-flex gap-2">
                        <input type="reset" class="btn btn-outline-dark" value="Limpar">
                        <input type="submit" class="btn btn-success" value="Salvar">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
